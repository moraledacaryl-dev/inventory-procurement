name: Pass 18 transfer patch

on:
  push:
    branches:
      - audit/pass-18-concurrency-count-controls
    paths:
      - .github/workflows/pass18-transfer-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/pass-18-concurrency-count-controls
      - name: Patch transfer dispatch lock ordering
        run: |
          python - <<'PY'
          from pathlib import Path

          route = Path('backend/app/api/routes/controlled_inventory.py')
          text = route.read_text()

          old_helper = '''def physical_quantity(db: Session, item_id: str, location_id: str) -> Decimal:\n    row = balance_row(db, item_id, location_id)\n    return Decimal(row.quantity) if row else Decimal("0")\n\n\ndef reserved_quantity'''
          new_helper = '''def physical_quantity(db: Session, item_id: str, location_id: str) -> Decimal:\n    row = balance_row(db, item_id, location_id)\n    return Decimal(row.quantity) if row else Decimal("0")\n\n\ndef locked_available_quantity(db: Session, item_id: str, location_id: str) -> Decimal:\n    # Reservation creation locks this same balance row before checking availability.\n    # Lock it here first so dispatch and reservation decisions serialize.\n    row = balance_row(db, item_id, location_id, lock=True)\n    physical = Decimal(row.quantity) if row else Decimal("0")\n    return physical - reserved_quantity(db, item_id, location_id)\n\n\ndef reserved_quantity'''
          assert text.count(old_helper) == 1, 'physical quantity helper anchor changed'
          text = text.replace(old_helper, new_helper)

          old_dispatch = '''    transit = transit_location(db)\n    entries = []\n    for line in row.lines:\n        available = physical_quantity(db, line.item_id, row.source_location_id) - reserved_quantity(db, line.item_id, row.source_location_id)\n        if Decimal(line.quantity) > available:'''
          new_dispatch = '''    transit = transit_location(db)\n    entries = []\n    # Acquire source balance locks in deterministic item order to serialize against\n    # reservations and avoid deadlocks between concurrent multi-line dispatches.\n    for line in sorted(row.lines, key=lambda transfer_line: transfer_line.item_id):\n        available = locked_available_quantity(db, line.item_id, row.source_location_id)\n        if Decimal(line.quantity) > available:'''
          assert text.count(old_dispatch) == 1, 'dispatch loop anchor changed'
          text = text.replace(old_dispatch, new_dispatch)
          route.write_text(text)

          test = Path('backend/tests/test_controlled_inventory.py')
          test_text = test.read_text()
          addition = '''\n\ndef test_transfer_availability_locks_balance_before_reservations(monkeypatch):\n    from types import SimpleNamespace\n    from app.api.routes import controlled_inventory\n\n    calls = []\n\n    def fake_balance_row(db, item_id, location_id, lock=False):\n        calls.append(("balance", lock))\n        return SimpleNamespace(quantity="10")\n\n    def fake_reserved_quantity(db, item_id, location_id):\n        calls.append(("reserved", None))\n        return controlled_inventory.Decimal("3")\n\n    monkeypatch.setattr(controlled_inventory, "balance_row", fake_balance_row)\n    monkeypatch.setattr(controlled_inventory, "reserved_quantity", fake_reserved_quantity)\n\n    available = controlled_inventory.locked_available_quantity(object(), "item-1", "source-1")\n\n    assert available == controlled_inventory.Decimal("7")\n    assert calls == [("balance", True), ("reserved", None)]\n'''
          assert 'test_transfer_availability_locks_balance_before_reservations' not in test_text
          test.write_text(test_text.rstrip() + addition + '\n')
          PY
      - name: Verify focused tests
        working-directory: backend
        run: |
          python -m compileall app tests
      - name: Commit patch
        run: |
          git config user.name "moraledacaryl-dev"
          git config user.email "moraledacaryl@gmail.com"
          git add backend/app/api/routes/controlled_inventory.py backend/tests/test_controlled_inventory.py
          git diff --cached --check
          git commit -m "Serialize transfer dispatch against reservations"
          git push origin HEAD:audit/pass-18-concurrency-count-controls
