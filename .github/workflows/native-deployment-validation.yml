name: Native Deployment Validation
on: [push, pull_request]
jobs:
  native-deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate installer shell syntax
        run: |
          bash -n deploy/install-native.sh
          bash -n deploy/release-native.sh
      - name: Validate example backend environment is shell-sourceable and valid JSON
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source deploy/env/inventory-backend.env.example
          set +a
          python3 - <<'PY'
          import json,os
          for key in ('CORS_ORIGINS','TRUSTED_HOSTS'):
              assert isinstance(json.loads(os.environ[key]),list), f'{key} is not a JSON list'
          destinations=json.loads(os.environ['INTEGRATION_ENDPOINTS_JSON'])
          assert isinstance(destinations,dict)
          assert destinations.get('accounting')=='https://accounting.hiddenoasis.app'
          assert destinations.get('operations')=='https://operations.hiddenoasis.app'
          assert os.environ['APP_NAME']=='Hidden Oasis Inventory & Procurement'
          print('Example Inventory systemd/bash integration JSON is valid')
          PY
      - name: Validate generated frontend file handling
        run: |
          grep -q 'chown hiddenoasis:hiddenoasis.*frontend/next-env.d.ts' deploy/install-native.sh
          grep -q 'git -C.*restore -- frontend/next-env.d.ts' deploy/install-native.sh
          grep -q 'npm ci --include=dev' deploy/install-native.sh
      - name: Validate systemd unit structure
        run: |
          for unit in deploy/systemd/*.service deploy/systemd/*.timer; do
            grep -q '^\[Unit\]' "$unit"
          done
          grep -q '^\[Service\]' deploy/systemd/*.service
          grep -q '^\[Timer\]' deploy/systemd/*.timer
          grep -q '^ExecStart=' deploy/systemd/*.service
      - name: Validate verified server paths and ports
        run: |
          grep -q '/opt/inventory-procurement-online' deploy/systemd/hiddenoasis-inventory-backend.service
          grep -q '/etc/hiddenoasis/inventory-backend.env' deploy/systemd/hiddenoasis-inventory-backend.service
          grep -q '127.0.0.1:8300' deploy/nginx/inventory-hiddenoasis.conf
          grep -q '127.0.0.1:3300' deploy/nginx/inventory-hiddenoasis.conf
      - name: Require safe native database migration and exact release process
        run: |
          grep -q 'pg_dump -Fc' deploy/install-native.sh
          grep -q 'pg_restore --list' deploy/install-native.sh
          grep -q 'sha256sum' deploy/install-native.sh
          grep -q 'pg_is_in_recovery()' deploy/install-native.sh
          grep -q 'production_preflight.py' deploy/install-native.sh
          grep -q 'INVENTORY DEPLOYMENT GATE: PASS' deploy/install-native.sh
          grep -q 'git -C "$APP_DIR" fetch --no-tags origin main' deploy/release-native.sh
          grep -q 'git -C "$APP_DIR" checkout --detach "$TARGET_SHA"' deploy/release-native.sh
          grep -q 'Require all five main-branch quality gates' .github/workflows/deploy-inventory-native.yml
          grep -q 'appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262' .github/workflows/deploy-inventory-native.yml
