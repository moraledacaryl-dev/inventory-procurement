name: Resilience Assurance
on: [push, pull_request]

jobs:
  backup-restore:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: inventory_resilience
          POSTGRES_USER: inventory
          POSTGRES_PASSWORD: inventory_resilience
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U inventory -d inventory_resilience"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql+psycopg://inventory:inventory_resilience@127.0.0.1:5432/inventory_resilience
      RESTORED_DATABASE_URL: postgresql+psycopg://inventory:inventory_resilience@127.0.0.1:5432/inventory_restored
      PGPASSWORD: inventory_resilience
      JWT_SECRET: resilience-assurance-secret-that-is-long-enough
      BOOTSTRAP_OWNER_EMAIL: owner@example.com
      BOOTSTRAP_OWNER_PASSWORD: acceptance-owner-password
      BOOTSTRAP_OWNER_NAME: Resilience Owner
      BACKUP_DIR: /tmp/inventory-production-backups
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -q -r requirements.txt
      - name: Build representative source database
        working-directory: backend
        run: |
          alembic upgrade head
          python scripts/seed_acceptance.py
      - name: Run PostgreSQL concurrency and failure assurance
        working-directory: backend
        run: |
          set -o pipefail
          python scripts/run_resilience_checks.py 2>&1 | tee resilience-checks.log
      - name: Create production-format PostgreSQL backup
        working-directory: backend
        run: |
          set -euo pipefail
          rm -rf "$BACKUP_DIR"
          mkdir -p "$BACKUP_DIR"
          python scripts/backup_database.py | tee production-backup.log
          BACKUP_FILE="$(tail -n 1 production-backup.log)"
          test -s "$BACKUP_FILE"
          case "$BACKUP_FILE" in
            "$BACKUP_DIR"/inventory-*.sql.gz) ;;
            *) echo "Unexpected backup path: $BACKUP_FILE" >&2; exit 1 ;;
          esac
          gzip -t "$BACKUP_FILE"
          printf '%s\n' "$BACKUP_FILE" > /tmp/inventory-backup-path
      - name: Verify production backup record and checksum
        working-directory: backend
        run: |
          set -euo pipefail
          BACKUP_FILE="$(cat /tmp/inventory-backup-path)"
          python - "$BACKUP_FILE" <<'PY'
          import hashlib
          import pathlib
          import sys
          from sqlalchemy import select
          from app.db.session import SessionLocal
          from app.models.operations import BackupRecord

          path = pathlib.Path(sys.argv[1])
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          with SessionLocal() as db:
              record = db.scalar(
                  select(BackupRecord)
                  .where(BackupRecord.filename == path.name)
                  .order_by(BackupRecord.id.desc())
              )
              assert record is not None, "backup record missing"
              assert record.size_bytes == path.stat().st_size, "backup size mismatch"
              assert record.checksum_sha256 == digest, "backup checksum mismatch"
          PY
      - name: Restore production backup into clean database
        run: |
          set -euo pipefail
          BACKUP_FILE="$(cat /tmp/inventory-backup-path)"
          createdb --host=127.0.0.1 --port=5432 --username=inventory inventory_restored
          gzip -dc "$BACKUP_FILE" | psql \
            --host=127.0.0.1 \
            --port=5432 \
            --username=inventory \
            --dbname=inventory_restored \
            --set=ON_ERROR_STOP=1
      - name: Verify restored database equivalence
        working-directory: backend
        run: |
          set -o pipefail
          python scripts/verify_database_equivalence.py "$DATABASE_URL" "$RESTORED_DATABASE_URL" 2>&1 | tee restore-verification.log
      - name: Run restored database readiness checks
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://inventory:inventory_resilience@127.0.0.1:5432/inventory_restored
        run: |
          alembic current
          python scripts/verify_demo_data.py
      - name: Upload recovery and resilience evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resilience-assurance-evidence
          path: |
            /tmp/inventory-production-backups/
            backend/production-backup.log
            backend/resilience-checks.log
            backend/restore-verification.log
