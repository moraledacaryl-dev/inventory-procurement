name: Lockfile Hotfix

on:
  push:
    branches:
      - hotfix/npm-ci-lock-sync

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/npm-ci-lock-sync
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Regenerate package lock
        working-directory: frontend
        run: npm install --package-lock-only --include=dev
      - name: Verify clean install
        working-directory: frontend
        run: npm ci --include=dev
      - name: Commit regenerated lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m 'Synchronize frontend lockfile for npm ci'
          git push origin HEAD:hotfix/npm-ci-lock-sync
