name: One-time Group F Next.js Lockfile Refresh

on:
  push:
    branches: [hardening/group-f-accounting-evidence-20261023]
    paths:
      - '.github/workflows/group-f-lockfile-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/group-f-accounting-evidence-20261023
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regenerate genuine npm dependency lock
        working-directory: frontend
        run: |
          set -euo pipefail
          npm install --save-exact next@16.4.2 --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --include=dev --ignore-scripts --no-audit --no-fund
          node -e 'const p=require("./package.json");const l=require("./package-lock.json");if(p.dependencies.next!=="16.4.2"||l.packages["node_modules/next"].version!=="16.4.2")process.exit(1)'
      - name: Commit dependency files to this same feature branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency versions already current"
          else
            git commit -m "security: upgrade Next.js to 16.4.2 and regenerate exact lockfile"
            git push origin HEAD:hardening/group-f-accounting-evidence-20261023
          fi
